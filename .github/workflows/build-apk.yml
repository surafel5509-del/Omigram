name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME:-}"

          if [[ -z "${JAVA_HOME:-}" || ! -x "${JAVA_HOME}/bin/java" ]]; then
            echo "ERROR: JAVA_HOME is not set to a usable Java installation." >&2
            exit 1
          fi

          java_major="$(java -version 2>&1 | awk -F '[\".]' '/version/ {print ($2 == "1" ? $3 : $2); exit}')"
          if [[ -z "$java_major" || ! "$java_major" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine the active Java major version." >&2
            exit 1
          fi

          if (( java_major < 17 )); then
            echo "ERROR: Java 17 or newer is required; detected Java $java_major." >&2
            exit 1
          fi

          echo "Java major version $java_major is supported."

      - name: Verify AGP version
        shell: bash
        run: |
          set -euo pipefail
          versions_file="gradle/libs.versions.toml"

          if [[ ! -f "$versions_file" ]]; then
            echo "ERROR: $versions_file does not exist." >&2
            exit 1
          fi

          agp_version="$(awk -F '"' '/^[[:space:]]*agp[[:space:]]*=[[:space:]]*/ {print $2; exit}' "$versions_file")"
          echo "Detected AGP version: ${agp_version:-<missing>}"

          if [[ "$agp_version" != "9.1.1" ]]; then
            echo "ERROR: AGP must be exactly 9.1.1; detected '${agp_version:-<missing>}'." >&2
            exit 1
          fi

          echo "AGP 9.1.1 confirmed."

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_SDK_ROOT:-}" || ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "ERROR: Android SDK command-line tools are not available on the runner." >&2
            exit 1
          fi

          sdkmanager_path="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" "platforms;android-36.1" "build-tools;36.1.0"

          if [[ ! -d "${ANDROID_SDK_ROOT}/platforms/android-36.1" ]]; then
            echo "ERROR: Android SDK Platform 36.1 was not installed." >&2
            exit 1
          fi

          if [[ ! -d "${ANDROID_SDK_ROOT}/build-tools/36.1.0" ]]; then
            echo "ERROR: Android SDK Build-Tools 36.1.0 was not installed." >&2
            exit 1
          fi

          echo "Android SDK Platform 36.1 and Build-Tools 36.1.0 are ready."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle_version="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [[ "$gradle_version" != "9.3.1" ]]; then
            echo "ERROR: Gradle 9.3.1 is required; detected '${gradle_version:-<missing>}'." >&2
            exit 1
          fi
          echo "Gradle 9.3.1 confirmed."

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="./debug.keystore"

          if [[ ! -f "$keystore" ]]; then
            echo "Creating temporary debug keystore with Java 17 keytool..."
            echo "::add-mask::android"
            export OMIGRAM_DEBUG_KEYSTORE_PASSWORD=android
            export OMIGRAM_DEBUG_KEY_PASSWORD=android

            "$JAVA_HOME/bin/keytool" -genkeypair \
              -keystore "$keystore" \
              -storepass:env OMIGRAM_DEBUG_KEYSTORE_PASSWORD \
              -alias androiddebugkey \
              -keypass:env OMIGRAM_DEBUG_KEY_PASSWORD \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt

            unset OMIGRAM_DEBUG_KEYSTORE_PASSWORD OMIGRAM_DEBUG_KEY_PASSWORD
          else
            echo "debug.keystore already exists; generation is not needed."
          fi

          if [[ ! -f "$keystore" ]]; then
            echo "ERROR: ./debug.keystore could not be created." >&2
            exit 1
          fi

          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"

          if [[ -f "$apk_path" ]]; then
            echo "Debug APK found: $apk_path"
            exit 0
          fi

          echo "Expected debug APK is missing: $apk_path" >&2
          echo "APK files discovered under app/build/outputs/apk:" >&2
          if [[ -d "app/build/outputs/apk" ]]; then
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
          else
            echo "app/build/outputs/apk does not exist." >&2
          fi

          echo "ERROR: No debug APK exists at the required path." >&2
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary debug keystore
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./debug.keystore
          if [[ -e ./debug.keystore ]]; then
            echo "ERROR: Temporary debug keystore could not be removed." >&2
            exit 1
          fi
          echo "Temporary debug keystore removed."
